<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hyphn</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">
  <div class="bg" aria-hidden="true">
    <div class="halo"></div>
    <svg class="trame" id="trame" viewBox="0 0 400 300" preserveAspectRatio="none"></svg>
    <svg class="grain"><filter id="gr"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"></feTurbulence></filter><rect width="100%" height="100%" filter="url(#gr)"></rect></svg>
  </div>

  <header class="top">
    <div class="logo"><span class="mark" aria-hidden="true"><span class="d"></span><span class="b"></span><span class="d"></span></span>hyphn</div>
    <nav class="navp" aria-label="Menu">
      <a href="#home" data-route="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
      <a href="#cam" data-route="cam"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="14" height="12" rx="2.5"/><path d="M16 10.5l6-3.5v10l-6-3.5z"/></svg>Cam</a>
      <a href="#drop" data-route="drop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg>Drop</a>
    </nav>
    <div class="right">
      <div class="devc" id="devc"><span class="led off"></span>No device</div>
      <a class="ib" href="#settings" data-route="settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></a>
    </div>
  </header>

  <div id="view"></div>
</div>
<div id="layer"></div>
<script src="fr.js"></script>
<script src="fxlook.js"></script>
<script src="fx.js"></script>
<script src="app.js"></script>
</body>
</html>
