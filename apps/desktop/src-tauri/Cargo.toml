[package]
name = "hyphn-desktop"
version = "0.1.0"
description = "Hyphn for Windows: pair with the iPhone, Cam, Drop and Pulse"
edition = "2021"
publish = false

[lib]
name = "hyphn_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rcgen = "0.13"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
local-ip-address = "0.6"
thiserror = "2"
prost = "0.13"
tokio = { version = "1.54.1", features = ["net", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
mdns-sd = "0.21.6"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true
