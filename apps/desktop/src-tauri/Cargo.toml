[package]
name = "hyphn-desktop"
version = "0.1.0"
description = "Hyphn for Windows: pair with the iPhone, Cam, Windows webcam, OBS and Drop"
edition = "2021"
publish = false

[lib]
name = "hyphn_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rcgen = "0.13"
sha2 = "0.10"
rand = "0.8"
qrcode = { version = "0.14", default-features = false }
local-ip-address = "0.6"
thiserror = "2"
prost = "0.13"
bytes = "1"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1.54.1", features = ["net", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
mdns-sd = "0.21.6"
# Translation files from Mozilla (ADR-0033): HTTPS with the ring already used, zstd in pure Rust.
ureq = { version = "2", default-features = false, features = ["tls"] }
ruzstd = "0.8"
idevice = { version = "0.1.68", default-features = false, features = ["usbmuxd", "ring"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true
