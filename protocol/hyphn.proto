// Hyphn protocol, version 1. One contract for the iPhone, the PC and later Android.
//
// Transport: TCP + TLS 1.3 with a certificate on both sides (mutual TLS). Each
// side pins the other's certificate by its SHA-256 fingerprint (spec
// `Core - Appairage QR`, E4). Every message is one `Envelope`, prefixed by its
// length as a 4-byte big-endian unsigned integer. Maximum 16 MiB per message.
//
// Two kinds of connection on the same port, told apart by their first message:
// - control: `PairRequest` (first pairing) or `Hello` (paired device);
// - media:   `VideoHello`, then only `VideoFrame` from the iPhone (spec `Cam - Flux v1`).
//
// By USB cable (spec `Core - Liaison par cable`, ADR-0031) the PC opens each
// connection through usbmux to the iPhone's port 47801, so the TLS roles are
// swapped (PC client, iPhone server); the iPhone still sends the first message.
// A `PairRequest` with an empty token is only accepted on such a connection.
//
// The Rust side mirrors these messages by hand with prost derives
// (apps/desktop/src-tauri/src/proto.rs), the Swift side with a small codec
// (apps/ios/Sources/Hyphn/Wire.swift). Change all three together.

syntax = "proto3";

package hyphn.v1;

message Envelope {
  oneof msg {
    PairRequest pair_request = 1;   // iPhone -> PC
    PairPending pair_pending = 2;   // PC -> iPhone: token accepted, show the code
    PairConfirm pair_confirm = 3;   // iPhone -> PC: Evan's answer
    PairDone pair_done = 4;         // PC -> iPhone: device kept, play the animation
    Refused refused = 5;            // PC -> iPhone, then the PC closes
    Hello hello = 6;                // iPhone -> PC: paired device reconnects
    Welcome welcome = 7;            // PC -> iPhone
    DeviceStatus device_status = 8; // iPhone -> PC
    Ping ping = 9;                  // PC -> iPhone, every 5 s
    Pong pong = 10;                 // iPhone -> PC
    CamControl cam_control = 11;    // PC -> iPhone
    CamState cam_state = 12;        // iPhone -> PC
    CamQuality cam_quality = 13;    // iPhone -> PC
    VideoHello video_hello = 14;    // iPhone -> PC, first message of a media connection
    VideoFrame video_frame = 15;    // iPhone -> PC
    Forget forget = 16;             // either side: « Oublier »
    KeyRequest key_request = 17;    // PC -> iPhone: the decoder needs a keyframe now
    DropHello drop_hello = 18;      // iPhone -> PC, first message of a Drop connection
    DropPlan drop_plan = 19;        // iPhone -> PC: what is coming
    DropFile drop_file = 20;        // iPhone -> PC: one file starts
    DropChunk drop_chunk = 21;      // iPhone -> PC: 1 MB of it
    DropEnd drop_end = 22;          // iPhone -> PC: the file is over, with its SHA-256
    DropAck drop_ack = 23;          // PC -> iPhone: answer to DropPlan and DropEnd
    DropCancel drop_cancel = 24;    // either side: « Annuler »
    DropDone drop_done = 25;        // iPhone -> PC: the whole send is over
    // 26: DropStart (PC -> iPhone), removed by ADR-0030; not reused.
    DropHave drop_have = 27;        // iPhone -> PC: the Photos items chosen
    DropMissing drop_missing = 28;  // PC -> iPhone: the ones it does not have yet
    CableOpen cable_open = 29;      // iPhone -> PC, cable only: open one more connection to me
  }
}

// Drop v1 (spec `Drop - Photos vers le PC`): one connection per send, the
// app stays open. Files one after the other, each acknowledged.
message DropHello {}

// The iPhone cannot call the PC through the cable: it asks for a connection
// (Cam or Drop) and gives the next one it accepts to the request that waits.
message CableOpen {}

message DropPlan {
  uint32 items = 1;       // photos, videos and files to send
  uint32 files = 2;       // files to send (a Live Photo is two)
  uint64 bytes = 3;       // total size, used to check the PC's free space
  uint32 already = 4;     // items left out: already on the PC (DropMissing)
  repeated bytes previews = 5; // up to 8 small JPEG thumbnails, for the PC's confirmation
  uint32 photos = 6;      // photos among the items
  uint32 videos = 7;      // videos among the items
  uint32 docs = 8;        // files from the Files app among the items
}

message DropFile {
  string name = 1;        // original name, e.g. IMG_1234.HEIC
  uint64 size = 2;
  int64 taken_unix = 3;   // when the photo was taken (file date on the PC)
  uint32 year = 4;        // taken, in the iPhone's calendar: the folder
  uint32 month = 5;       // 1..12
  string asset_id = 6;    // Photos local identifier; empty for a file
  bytes sha256 = 7;       // known before sending: the PC may answer « duplicate »
  bool is_file = 8;       // from the Files app: goes to <folder>\Fichiers
  bool last_of_item = 9;  // when the PC answers « duplicate », the item may be complete
}

message DropChunk {
  bytes data = 1;
}

message DropEnd {
  bytes sha256 = 1;
  bool last_of_item = 2;  // the item (photo + its Live video) is complete
}

message DropAck {
  bool ok = 1;
  string reason = 2;      // when not ok, shown on the iPhone
  bool duplicate = 3;     // answer to DropFile: already on the PC, do not send it
}

message DropCancel {}

message DropDone {
  uint32 failed = 1;      // items that could not be sent
  uint32 already = 2;     // items already on the PC (by identifier or by content)
}

// ADR-0029: anti-duplicate by Photos identifier, before anything is exported.
message DropHave {
  repeated string asset_ids = 1;
}

message DropMissing {
  repeated string asset_ids = 1;
}

message PairRequest {
  uint32 protocol_version = 1;
  bytes token = 2;        // from the QR; empty by cable (ADR-0031)
  string device_name = 3;
  string model = 4;
  string app_version = 5;
}

message PairPending {
  string pc_name = 1;
}

message PairConfirm {
  bool accept = 1;
}

message PairDone {}

message Refused {
  enum Reason {
    REASON_UNKNOWN = 0;
    EXPIRED = 1;
    ALREADY_USED = 2;
    UNKNOWN_TOKEN = 3;
    WRONG_VERSION = 4;
    UNKNOWN_DEVICE = 5; // not paired, or forgotten on the PC
    BUSY = 6;           // another pairing is already waiting
  }
  Reason reason = 1;
  string message = 2;   // French text, shown as is
}

message Hello {
  uint32 protocol_version = 1;
  string device_name = 2;
  string model = 3;
  string app_version = 4;
}

message Welcome {
  string pc_name = 1;
}

enum Thermal {
  THERMAL_UNKNOWN = 0;
  NOMINAL = 1;
  FAIR = 2;
  SERIOUS = 3;
  CRITICAL = 4;
}

enum Charge {
  CHARGE_UNKNOWN = 0;
  UNPLUGGED = 1;
  CHARGING = 2;
  FULL = 3;
}

message DeviceStatus {
  int32 battery_percent = 1;      // -1 = unknown
  Charge charge = 2;
  bool low_power = 3;
  Thermal thermal = 4;
  uint64 storage_free_bytes = 5;  // 0 = unknown
  uint64 storage_total_bytes = 6; // 0 = unknown
  int64 measured_at_ms = 7;       // iPhone clock, Unix milliseconds
}

message Ping {
  uint64 id = 1;
}

message Pong {
  uint64 id = 1;
  int64 phone_us = 2;     // iPhone host clock when answering: lines up the two clocks
}

enum Codec {
  CODEC_UNKNOWN = 0;
  HEVC = 1;
  H264 = 2;
}

// Effective settings, after the thermal rule (RULES, Énergie 9).
message CamControl {
  bool live = 1;          // false = paused: nothing is sent
  uint32 height = 2;      // 2160, 1440, 1080, 720, 480
  uint32 fps = 3;
  uint32 bitrate_kbps = 4;
  Codec codec = 5;
  bool front = 6;
  uint32 lens = 7;        // 0 = 0.5x, 1 = 1x, 2 = 2x, 3 = 5x
  sint32 exposure_bias_tenths = 8; // -20..20 = -2..+2 EV
  bool focus_manual = 9;  // false = continuous auto focus
  uint32 focus = 10;      // 0 (near) .. 100 (far), when manual
  bool wb_manual = 11;    // false = auto white balance
  uint32 wb_kelvin = 12;  // 2500..8000, when manual
  bool torch = 13;
  uint32 stabilization = 14; // 0 off, 1 standard, 2 cinematic
  bool mirror = 15;       // picture flipped left-right on the iPhone (never the waiting screen)
  uint32 turn = 16;       // quarter turns clockwise on top of the level picture, 0..3 (never the waiting screen)
  bool preview = 17;      // paused, PC Cam page on screen: send a small preview (480p15) for the PC window only (ADR-0027)
  // Advanced settings (spec `Cam - Reglages avances`, E3). Older iPhones ignore them.
  bool exposure_manual = 18; // false = auto exposure (with exposure_bias_tenths)
  uint32 iso = 19;        // when manual, clamped by the iPhone to its range
  uint32 shutter_us = 20; // exposure time when manual, µs; never longer than one frame
  sint32 wb_tint = 21;    // -150 (green) .. 150 (magenta), when wb_manual
  uint32 zoom_percent = 22; // fine zoom on top of the lens: 100 = none, 200 = 2x more
  bool hdr = 23;          // video HDR (off by default, RULES Énergie 8)
  bool poi = 24;          // focus and exposure follow the point below, not the centre
  uint32 poi_x = 25;      // 0..1000 across the picture as sent (after turn and mirror)
  uint32 poi_y = 26;      // 0..1000 down the picture as sent
}

message CamState {
  bool open = 1;          // the Cam tab is open on the iPhone
  bool live = 2;
  uint32 width = 3;
  uint32 height = 4;
  uint32 fps = 5;
  Codec codec = 6;
  bool front = 7;
  uint32 lens = 8;
  uint32 lens_count = 9;  // back lenses this iPhone has (0.5x, 1x, 2x, 5x)
  // True only when Evan touched a button on the iPhone (Afficher, Pause, lens,
  // flip). The PC follows these; the other reports are just information, so
  // a late report never undoes what the PC asked.
  bool by_user = 10;
  // What this camera can do (spec `Cam - Reglages avances`, E7): the PC greys out the rest.
  bool caps = 11;         // false = older app: fields 12..20 unknown
  uint32 iso_min = 12;
  uint32 iso_max = 13;
  uint32 shutter_min_us = 14;
  uint32 shutter_max_us = 15; // already limited to one frame at the current fps
  uint32 zoom_max_percent = 16; // fine zoom reachable on top of the current lens
  bool manual_exposure_ok = 17;
  bool manual_focus_ok = 18;
  bool manual_wb_ok = 19;
  bool hdr_ok = 20;
  bool poi_ok = 21;
  bool torch_ok = 22;
}

// Evan picked a quality on the iPhone; the PC keeps it and answers CamControl.
message CamQuality {
  uint32 height = 1;
  uint32 fps = 2;
}

message VideoHello {}

message VideoFrame {
  int64 pts_us = 1;       // capture time, iPhone clock
  bool keyframe = 2;
  Codec codec = 3;
  uint32 width = 4;
  uint32 height = 5;
  bytes data = 6;         // Annex-B; parameter sets (VPS/SPS/PPS) before each keyframe
  int64 encoded_us = 7;   // out of the encoder, iPhone clock (same as pts_us)
  uint32 queued_bytes = 8; // bytes still waiting to leave the iPhone app before this frame
}

message Forget {}

// Sent when the PC window or the Windows webcam starts decoding, or after it
// dropped frames: the iPhone encodes its next frame as a keyframe.
message KeyRequest {}
